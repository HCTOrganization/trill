[package]
name = "trill-gamesupport"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
crc32fast.workspace = true
image.workspace = true
trill-match = { path = "../trill-match" }
thiserror.workspace = true

# The save-editor embedding API (the `ui` feature): SaveEditor and its
# opaque envelopes. Game and Family stay independent of this feature.
# Shape-oblivious —
# the actual UI lives in the private trill-gamesupport-common-ui. Off for
# headless consumers (engine hosts), which then link no
# UI toolkit.
iced = { workspace = true, optional = true }
semver.workspace = true
trill-patch = { workspace = true, features = ["package", "index"] }
unic-langid = { workspace = true, optional = true }

[features]
ui = ["dep:iced", "dep:unic-langid"]

[lints]
workspace = true
