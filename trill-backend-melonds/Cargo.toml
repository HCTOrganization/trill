[package]
name = "trill-backend-melonds"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The melonDS backend for trill-match: a pair of emulated DSes on
# emulated local wireless. Kept out of trill-match so the seam does not
# depend on any emulator, and out of the game crates so more than one DS
# game could share it.

[dependencies]
num-rational.workspace = true
trill-match = { path = "../trill-match" }
melonds = { workspace = true }
melonds-rollback = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
num-traits.workspace = true
