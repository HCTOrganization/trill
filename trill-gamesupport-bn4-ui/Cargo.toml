[package]
name = "trill-gamesupport-bn4-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save-editor UI: its `GameSaveUi` implementation and the
# `SAVE_UI` shell static `trill-gamesupport-bn4` re-exports behind its
# `ui` feature. A crate of its own so the feature flagging lives at the
# aggregator — nothing in here is cfg'd.

[dependencies]
trill-gamesupport-common-dataview = { path = "../trill-gamesupport-common-dataview" }
trill-gamesupport-common-ui = { path = "../trill-gamesupport-common-ui" }
trill-gamesupport-bn4-dataview = { path = "../trill-gamesupport-bn4-dataview" }
iced.workspace = true
unic-langid.workspace = true
sweeten.workspace = true

[lints]
workspace = true
