[package]
name = "melonds"
version = "0.1.0"
edition = "2021"
# The vendored melonDS core is GPL-3.0-or-later, which governs the
# combined work; the binding code is too so there's no ambiguity.
license = "GPL-3.0-or-later"
description = "Safe bindings to the melonDS Nintendo DS core, shaped for deterministic multi-instance embedding"

[dependencies]
melonds-sys = { path = "melonds-sys" }
log = "0.4"
thiserror = "1"

[dev-dependencies]
# Inherits the workspace's `image` version so vendoring this crate does
# not force a second-generation image/ravif upgrade on the app.
image = { workspace = true, features = ["png"] }
sha2 = "0.10"

[lints]
workspace = true

