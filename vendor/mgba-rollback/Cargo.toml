[package]
name = "mgba-rollback"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Generic rollback netplay over emulated GBA SIO — drives 2-4 mgba cores as one link through the lockstep driver"
repository = "https://github.com/tangobattle/mgba-rollback"

[dependencies]
crc32fast = "1"
getgud = { path = "../getgud" }
# Needs the SIO driver state carried in the savestate blob (SIOCNT/RCNT
# shadows + SIOMLT_SEND), on mgba-rs main since b3ad9c8.
mgba = { path = "../mgba-rs" }
# Raw C access for Link::load's overdue-completeEvent repair (see
# lib.rs); the same `mgba-sys` package the `mgba` path dependency builds,
# so cargo unifies them and the pointer types line up.
mgba-sys = { path = "../mgba-rs/mgba-sys" }

[lints]
workspace = true
