name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency audit tool
        run: cargo install cargo-machete --version 0.8.0 --locked
      - run: cargo machete
      - run: python3 tools/check_workspace.py
      - run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-22.04
    env:
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
    steps:
      # libdatachannel and Mbed TLS (under vendor/datachannel-facade) are
      # this repository's only submodules; the emulator cores are vendored
      # in-tree.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - name: Install native build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libssl-dev
      - name: Test portable core without native library adapters
        run: cargo test --locked --no-default-features -p trill-library -p trill-match -p trill-net-protocol -p trill-replay -p trill-gamesupport-common-dataview
      # Headless game registrations must coexist with editor consumers.
      - name: Test native library, sessions, and save editor together
        run: cargo test --locked --lib -p trill-library --features trill-library/gamesupport-bn6 -p trill-session -p trill-gamesupport-common-ui
      - name: Test game and editor registration
        run: cargo test --locked --lib -p trill-library --features trill-library/ui,trill-library/gamesupport-bn6
      - name: Check resolved architecture boundaries
        run: python3 tools/check_workspace.py --resolved
      - name: Test lobby and offline sessions independently
        run: |
          cargo test --locked --lib -p trill-lobby -p trill-net
          cargo test --locked --no-default-features --lib -p trill-session
