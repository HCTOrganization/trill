[package]
name = "trill-gamesupport-bn5ds"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# MegaMan Battle Network 5: Double Team DS.
#
# The first game whose engine is not mgba. The GBA crates build their
# netplay on `trill-match` (a pair of mgba cores on an emulated link
# cable); this one builds it on `melonds-rollback` (a pair of emulated
# DSes on emulated local wireless). Both are the same shape — boot a
# pair, prime it into a battle, run a rollback session over it — which
# is why the engine belongs to the game crate rather than to a single
# shared type.

[features]
# Pairs with the app's UI build, switching the save editor on: the
# read-only folder viewer from `trill-gamesupport-bn5ds-ui`.
ui = ["trill-gamesupport/ui", "dep:trill-gamesupport-bn5ds-ui"]

[dependencies]
trill-gamesupport = { path = "../trill-gamesupport" }
trill-gamesupport-bn5ds-dataview = { path = "../trill-gamesupport-bn5ds-dataview" }
trill-gamesupport-common = { path = "../trill-gamesupport-common" }
trill-gamesupport-common-dataview = { path = "../trill-gamesupport-common-dataview" }
trill-match = { path = "../trill-match" }
trill-backend-melonds = { path = "../trill-backend-melonds" }
log.workspace = true
image = { workspace = true, features = ["png"] }

trill-gamesupport-bn5ds-ui = { path = "../trill-gamesupport-bn5ds-ui", optional = true }

[lints]
workspace = true
