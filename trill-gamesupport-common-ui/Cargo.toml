[package]
name = "trill-gamesupport-common-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The save editor and its supporting cast: the shell implementing the
# public `trill_gamesupport::SaveEditor` embedding API, the view
# components the per-game `ui` crates compose, the save model + staged
# edits, the OpenSave baking, and the editor's fluent bundle. A crate of
# its own so the feature flagging lives at the per-game aggregators —
# nothing in here is cfg'd.

[dependencies]
trill-gamesupport = { path = "../trill-gamesupport", features = ["ui"] }
trill-gamesupport-common-dataview = { path = "../trill-gamesupport-common-dataview" }
trill-ui = { path = "../trill-ui" }
iced.workspace = true
iced_graphics.workspace = true
iced_tiny_skia.workspace = true
tiny-skia.workspace = true
sweeten.workspace = true
lucide-icons.workspace = true
fluent-templates.workspace = true
unic-langid.workspace = true
image = { workspace = true, features = ["png"] }
base64.workspace = true
indexmap.workspace = true

[lints]
workspace = true
